; Claude + Solar Display fuer GeekMagic SmallTV (240x240 ST7789)
[platformio]
default_envs = smalltv_ultra_esp8266, smalltv_pro_esp32

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

; SmallTV / SmallTV-Ultra (ESP8266, ESP-12F, 4 MB)
[env:smalltv_ultra_esp8266]
platform = espressif8266
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DBL_PIN=5
    -DBL_INVERTED=1

; SmallTV-Pro (ESP32-WROOM, 4 MB)
[env:smalltv_pro_esp32]
platform = espressif32@6.9.0
board = esp32dev
board_build.filesystem = littlefs
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DBL_PIN=25
    -DBL_INVERTED=1

; Schritt 1 fuer den SmallTV-Ultra: winzige Zwischen-Firmware, die neben die
; Original-Firmware passt und danach die volle Firmware unter /update annimmt
[env:smalltv_ultra_stage1]
platform = espressif8266
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
build_src_filter = +<stage1.cpp>
lib_deps =
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DNDEBUG
